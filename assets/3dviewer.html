<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ALEF TUS 3 Boyutlu Anatomi Atlası</title>
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%; height: 100%;
      background: #070D18;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      color: #FFFFFF;
    }
    #canvas-container {
      width: 100vw; height: 100vh;
      position: absolute; top: 0; left: 0;
      z-index: 1;
      background: radial-gradient(circle at center, #0F1E36 0%, #070D18 80%);
    }

    /* Top Control Bar */
    #top-controls {
      position: absolute; top: 12px; left: 14px; right: 14px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 60; pointer-events: none;
    }
    #mode-selector {
      pointer-events: auto;
      display: flex; gap: 4px;
      background: rgba(13, 25, 45, 0.92);
      border: 1px solid rgba(0, 240, 255, 0.35);
      border-radius: 24px; padding: 4px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      touch-action: manipulation;
    }
    .mode-tab {
      background: transparent; border: none;
      color: #8CA9C9; font-size: 11px; font-weight: 700;
      padding: 6px 12px; border-radius: 18px;
      cursor: pointer; transition: all 0.2s ease;
      touch-action: manipulation;
    }
    .mode-tab.active {
      background: linear-gradient(135deg, #00C6FF, #0072FF);
      color: #FFFFFF;
      box-shadow: 0 2px 12px rgba(0, 198, 255, 0.5);
    }

    .action-buttons {
      display: flex; gap: 8px; pointer-events: auto;
      touch-action: manipulation;
    }
    .circle-btn {
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(13, 25, 45, 0.92);
      border: 1px solid rgba(0, 240, 255, 0.35);
      color: #00F0FF; font-size: 15px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      touch-action: manipulation;
    }
    .circle-btn:active {
      transform: scale(0.92);
    }
    .circle-btn.active {
      background: #00F0FF; color: #070D18;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.8);
    }

    /* Quiz Prompt Bar */
    #quiz-box {
      display: none; position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
      width: 92%; max-width: 420px;
      background: linear-gradient(135deg, rgba(239, 71, 111, 0.95), rgba(255, 107, 107, 0.95));
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      border-radius: 14px;
      padding: 10px 16px; z-index: 70;
      box-shadow: 0 8px 25px rgba(239, 71, 111, 0.45);
      text-align: center; color: white;
      pointer-events: auto;
      touch-action: manipulation;
    }
    #quiz-score-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px;
      color: #FFE600; margin-bottom: 4px;
    }
    #quiz-prompt {
      font-size: 14px; font-weight: 800; line-height: 1.35;
    }
    #quiz-target-name {
      color: #FFFFFF; text-decoration: underline; text-underline-offset: 3px;
    }

    /* Hotspot Carousel at bottom */
    #hotspot-carousel-wrap {
      position: absolute; bottom: 18px; left: 0; right: 0;
      z-index: 60; display: flex; flex-direction: column; align-items: center;
      pointer-events: none;
    }
    #hotspot-carousel {
      display: flex; gap: 8px; overflow-x: auto; max-width: 96vw;
      padding: 6px 16px; pointer-events: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
    }
    #hotspot-carousel::-webkit-scrollbar { display: none; }
    .hotspot-chip {
      white-space: nowrap;
      background: rgba(13, 25, 45, 0.92);
      border: 1px solid rgba(0, 240, 255, 0.35);
      color: #E2EBF5; font-size: 12px; font-weight: 600;
      padding: 8px 14px; border-radius: 20px;
      cursor: pointer; transition: all 0.2s ease;
      display: flex; align-items: center; gap: 7px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      touch-action: manipulation;
    }
    .hotspot-chip:active {
      transform: scale(0.95);
    }
    .hotspot-chip .dot {
      width: 8px; height: 8px; border-radius: 50%;
    }
    .hotspot-chip.active {
      background: linear-gradient(135deg, #00C6FF, #0072FF);
      border-color: #00F0FF; color: #FFFFFF;
      box-shadow: 0 0 16px rgba(0, 198, 255, 0.7);
      transform: translateY(-2px);
    }

    /* Info Sheet Modal */
    #info-sheet {
      position: absolute; bottom: 76px; left: 50%; transform: translateX(-50%) translateY(20px);
      width: 92%; max-width: 440px;
      background: rgba(10, 20, 36, 0.96);
      border: 1.5px solid #00F0FF;
      border-radius: 18px;
      padding: 16px 18px;
      z-index: 100;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.85), 0 0 25px rgba(0, 240, 255, 0.25);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      opacity: 0; pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      touch-action: pan-y;
      max-height: 55vh;
      overflow-y: auto;
    }
    #info-sheet.show {
      opacity: 1; pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    #sheet-close {
      position: absolute; top: 12px; right: 12px;
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.12); border: none;
      color: #FFFFFF; font-size: 15px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; touch-action: manipulation;
    }
    #sheet-close:active {
      background: rgba(255, 255, 255, 0.25);
    }
    #sheet-tag {
      display: inline-block; font-size: 10px; font-weight: 800;
      padding: 3px 9px; border-radius: 10px;
      background: rgba(0, 240, 255, 0.15); color: #00F0FF;
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.6px;
    }
    #sheet-title {
      font-size: 18px; font-weight: 900; color: #FFFFFF;
      margin-bottom: 2px; line-height: 1.25;
    }
    #sheet-latin {
      font-size: 12px; font-style: italic; color: #FFD166;
      margin-bottom: 8px;
    }
    #sheet-detail {
      font-size: 13px; line-height: 1.5; color: #D2E4F7;
      margin-bottom: 8px;
    }
    .sheet-meta-box {
      background: rgba(0, 0, 0, 0.4); border-radius: 10px;
      padding: 9px 12px; margin-top: 6px;
      border-left: 3px solid #00F0FF;
    }
    .sheet-meta-label {
      font-size: 10px; font-weight: bold; color: #00F0FF; text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .sheet-meta-text {
      font-size: 12px; color: #E8F1FA; margin-top: 3px; line-height: 1.45; white-space: pre-line;
    }

    /* Toast Notification */
    #toast {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
      padding: 14px 24px; border-radius: 25px;
      font-weight: 800; font-size: 14px;
      color: white; z-index: 200;
      display: none; opacity: 0; transition: all 0.25s cubic-bezier(0.17, 0.89, 0.32, 1.28);
      pointer-events: none; text-align: center; max-width: 85%;
    }
    #toast.success {
      background: linear-gradient(135deg, #00B09B, #96C93D);
      box-shadow: 0 0 25px rgba(0, 176, 155, 0.8);
    }
    #toast.error {
      background: linear-gradient(135deg, #FF416C, #FF4B2B);
      box-shadow: 0 0 25px rgba(255, 65, 108, 0.8);
    }

    /* Loading Screen */
    #loader {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #070D18; z-index: 500;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 52px; height: 52px;
      border: 3.5px solid rgba(0, 240, 255, 0.15);
      border-top-color: #00F0FF; border-right-color: #0072FF;
      border-radius: 50%;
      animation: spin 0.9s infinite linear;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #loader-text {
      margin-top: 18px; font-size: 14px; font-weight: 700; color: #00F0FF;
      letter-spacing: 0.5px;
    }
    #loader-sub {
      margin-top: 4px; font-size: 11px; color: #728DAE;
    }
  </style>

    <div class="action-buttons">

  <!-- Quiz Box -->

    <div id="quiz-prompt">

    </div>
  </div>

  <div id="hotspot-carousel-wrap">

  </div>

  <!-- Info Sheet Modal -->

    <button id="sheet-close" onclick="closeSheet()">✕</button>

      <div class="sheet-meta-text" id="sheet-meta-text"></div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast"></div>

    // Helper: URL param extractor (query + hash)
    function getParam(key, defaultValue) {
      var query = window.location.search.substring(1);
      var hash = window.location.hash.substring(1);
      var full = query + '&' + hash;
      var vars = full.split('&');
      for (var i = 0; i < vars.length; i++) {
        var pair = vars[i].split('=');
        if (decodeURIComponent(pair[0]) === key && pair[1] !== undefined) {
          return decodeURIComponent(pair[1]);
        }
      }
      return defaultValue;
    }

    var requestedId = getParam('id', 'heart');
    var requestedModel = getParam('model', 'models/heart.glb');
    var requestedTitle = getParam('title', 'Kalp');

    var hitTargetMeshes = []; // Larger invisible hit targets for responsive touch
    var activeHotspotId = null;
    var quizTarget = null;

    var raycaster = new THREE.Raycaster();
    var mouse = new THREE.Vector2();

    // Prevent touch drag & jitter on all UI controls
    function setupUIEventGuards() {
      var uiElements = ['top-controls', 'mode-selector', 'quiz-box', 'hotspot-carousel-wrap', 'info-sheet'];
      uiElements.forEach(function(id) {
        var el = document.getElementById(id);
        if (el) {
          ['pointerdown', 'pointermove', 'pointerup', 'touchstart', 'touchmove', 'touchend'].forEach(function(evt) {
            el.addEventListener(evt, function(e) {
              e.stopPropagation();
            }, { passive: false });
          });
        }
      });
    }

    function initScene() {
      var container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x070D18);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.05, 50);
      camera.position.copy(originalCameraPos);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setClearColor(0x070D18, 1);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.07;
      controls.rotateSpeed = 0.8;
      controls.zoomSpeed = 1.0;
      controls.panSpeed = 0.7;
      controls.minDistance = 0.3;
      controls.maxDistance = 10;

      // Lights
      var ambientLight = new THREE.AmbientLight(0xFFFFFF, 0.95);
      scene.add(ambientLight);

      var mainLight = new THREE.DirectionalLight(0xFFFFFF, 1.2);
      mainLight.position.set(5, 10, 7);
      scene.add(mainLight);

      var rimLight = new THREE.DirectionalLight(0x00C6FF, 0.85);
      rimLight.position.set(-5, -3, -5);
      scene.add(rimLight);

      var warmLight = new THREE.DirectionalLight(0xFFA500, 0.45);
      warmLight.position.set(0, -6, 4);
      scene.add(warmLight);

      renderer.domElement.addEventListener('pointerup', onPointerUp, false);
      window.addEventListener('resize', onWindowResize, false);

      setupUIEventGuards();
    }

    function loadCatalog() {
      var catalog = window.EMBEDDED_CATALOG || { organs: [], systems: [] };
      var allItems = (catalog.organs || []).concat(catalog.systems || []);

      activeOrganData = allItems.find(function(o) {
        return o.id === requestedId || (o.model && o.model.indexOf(requestedId) !== -1) || (o.title && o.title.toLowerCase() === requestedTitle.toLowerCase());
      }) || allItems[0];

      if (!activeOrganData) {
        activeOrganData = {
          id: requestedId,
          title: requestedTitle,
          latin: 'Cor',
          system: 'Kardiyovasküler',
          icon: '🫀',
          model: requestedModel,
          accent: '#00F0FF',
          scale: 2.0,
          description: '3 Boyutlu Anatomi Modeli',
          clinical: 'TUS sınavı ve klinik tıp açısından kritik anatomik yapılar.',
          hotspots: []
        };
      }

      load3DModel(activeOrganData.model || requestedModel);
    }

    function load3DModel(modelUrl) {
      var loader = new THREE.GLTFLoader();

      if (typeof MeshoptDecoder !== 'undefined') {
        if (MeshoptDecoder.ready) {
          MeshoptDecoder.ready.then(function() {
            loader.setMeshoptDecoder(MeshoptDecoder);
            executeLoad(loader, modelUrl);
          });
          return;
        } else {
          loader.setMeshoptDecoder(MeshoptDecoder);
        }
      }
      executeLoad(loader, modelUrl);
    }

    function executeLoad(loader, modelUrl) {
      loader.load(
        modelUrl,
        function (gltf) {
          mainModel = gltf.scene;

          var box = new THREE.Box3().setFromObject(mainModel);
          var size = box.getSize(new THREE.Vector3());
          var center = box.getCenter(new THREE.Vector3());
          var maxDim = Math.max(size.x, size.y, size.z);

          if (maxDim > 0) {
            var targetScale = (activeOrganData.scale || 2.0) / maxDim;
            mainModel.scale.set(targetScale, targetScale, targetScale);
          }

          box.setFromObject(mainModel);
          box.getCenter(center);
          mainModel.position.sub(center);

          scene.add(mainModel);

          createHotspotMarkers();
          buildHotspotCarousel();

          var loaderElem = document.getElementById('loader');
          loaderElem.style.opacity = '0';
          setTimeout(function() { loaderElem.style.display = 'none'; }, 400);

          // Apply initial learn mode
          selectMode('learn');

          animate();
        },
        function (xhr) {
          if (xhr.lengthComputable) {
            var pct = Math.round((xhr.loaded / xhr.total) * 100);
            document.getElementById('loader-text').innerText = '%' + pct + ' Yükleniyor...';
          }
        },
        function (error) {
          console.error('GLTF Load Error:', error);
          document.getElementById('loader-text').innerText = 'Model Yüklenemedi';
          document.getElementById('loader-sub').innerText = (error && error.message) || 'Lütfen tekrar deneyin';
        }
      );
    }

    function createHotspotMarkers() {
      hotspotMarkers.forEach(function(m) { scene.remove(m); });
      hotspotMarkers = [];
      hitTargetMeshes = [];

      if (!activeOrganData || !activeOrganData.hotspots || activeOrganData.hotspots.length === 0) {
        return;
      }

      var sphereGeo = new THREE.SphereGeometry(0.06, 16, 16);
      var ringGeo = new THREE.RingGeometry(0.08, 0.12, 24);
      // Large invisible hit target sphere (radius 0.28) for easy mobile touching
      var hitGeo = new THREE.SphereGeometry(0.28, 12, 12);
      var hitMat = new THREE.MeshBasicMaterial({
        transparent: true,
        opacity: 0.001,
        depthWrite: false
      });

      activeOrganData.hotspots.forEach(function(hs, idx) {
        var markerGroup = new THREE.Group();
        markerGroup.position.set(hs.position[0], hs.position[1], hs.position[2]);

        var markerColor = hs.color ? new THREE.Color(hs.color) : new THREE.Color(0x00F0FF);

        // Core visual sphere
        var sphereMat = new THREE.MeshBasicMaterial({ color: markerColor });
        var sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
        markerGroup.add(sphereMesh);

        // Outer pulsing ring
        var ringMat = new THREE.MeshBasicMaterial({
          color: markerColor,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.85
        });
        var ringMesh = new THREE.Mesh(ringGeo, ringMat);
        markerGroup.add(ringMesh);

        // Invisible touch collision hitbox
        var hitMesh = new THREE.Mesh(hitGeo, hitMat);
        markerGroup.add(hitMesh);

        markerGroup.userData = {
          hotspot: hs,
          index: idx,
          ringMesh: ringMesh,
          sphereMesh: sphereMesh,
          hitMesh: hitMesh
        };

        hitMesh.userData = {
          hotspot: hs,
          markerGroup: markerGroup
        };

        scene.add(markerGroup);
        hotspotMarkers.push(markerGroup);
        hitTargetMeshes.push(hitMesh);
      });
    }

    function buildHotspotCarousel() {
      var carousel = document.getElementById('hotspot-carousel');
      carousel.innerHTML = '';

      if (!activeOrganData.hotspots || activeOrganData.hotspots.length === 0) {
        var chip = document.createElement('div');
        chip.className = 'hotspot-chip active';
        chip.innerHTML = '<span>📖 Genel Bilgi</span>';
        chip.onclick = function() { showGeneralOrganInfo(); };
        carousel.appendChild(chip);
        return;
      }

      var generalChip = document.createElement('div');
      generalChip.className = 'hotspot-chip';
      generalChip.id = 'chip-general';
      generalChip.innerHTML = '<span>📖 ' + activeOrganData.title + ' Özeti</span>';
      generalChip.onclick = function() { showGeneralOrganInfo(); };
      carousel.appendChild(generalChip);

      activeOrganData.hotspots.forEach(function(hs) {
        var chip = document.createElement('div');
        chip.className = 'hotspot-chip';
        chip.id = 'chip-' + hs.id;
        var color = hs.color || '#00F0FF';
        chip.innerHTML = '<span class="dot" style="background:' + color + '; box-shadow:0 0 8px ' + color + '"></span><span>' + hs.title + '</span>';
        chip.onclick = function() { selectHotspot(hs.id, true); };
        carousel.appendChild(chip);
      });
    }

    function selectHotspot(id, zoomIn) {
      activeHotspotId = id;

      document.querySelectorAll('.hotspot-chip').forEach(function(c) { c.classList.remove('active'); });
      var activeChip = document.getElementById('chip-' + id);
      if (activeChip) {
        activeChip.classList.add('active');
        activeChip.scrollIntoView({ behavior: 'smooth', inline: 'center' });
      }

      var marker = hotspotMarkers.find(function(m) { return m.userData.hotspot.id === id; });
      if (!marker) return;

      var hs = marker.userData.hotspot;

      if (zoomIn) {
        var targetPos = new THREE.Vector3(hs.position[0], hs.position[1], hs.position[2]);
        var camOffset = targetPos.clone().normalize().multiplyScalar(1.5);
        if (camOffset.length() === 0) camOffset.set(0, 0, 1.5);
        var destination = targetPos.clone().add(camOffset);
        smoothMoveCamera(destination, targetPos);
      }

      showHotspotCard(hs);
    }

    var tweenData = null;
    function smoothMoveCamera(targetCamPos, targetLookAt) {
      tweenData = {
        startTime: performance.now(),
        duration: 750,
        startCamPos: camera.position.clone(),
        endCamPos: targetCamPos,
        startTarget: controls.target.clone(),
        endTarget: targetLookAt
      };
    }

    function updateCameraTween() {
      if (!tweenData) return;
      var elapsed = performance.now() - tweenData.startTime;
      var progress = Math.min(elapsed / tweenData.duration, 1.0);
      var ease = 0.5 - Math.cos(progress * Math.PI) / 2;

      camera.position.lerpVectors(tweenData.startCamPos, tweenData.endCamPos, ease);
      controls.target.lerpVectors(tweenData.startTarget, tweenData.endTarget, ease);
      controls.update();

      if (progress >= 1.0) {
        tweenData = null;
      }
    }

    // Touch / Pointer Handling
    function onPointerUp(event) {
      if (tweenData) return;

      var rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      var matchedHotspot = null;

      // 1. Check direct hits on large invisible hotspot hit targets
      if (hitTargetMeshes.length > 0) {
        var intersects = raycaster.intersectObjects(hitTargetMeshes, false);
        if (intersects.length > 0) {
          var hitMesh = intersects[0].object;
          if (hitMesh.userData && hitMesh.userData.hotspot) {
            matchedHotspot = hitMesh.userData.hotspot;
          }
        }
      }

      // 2. Intelligent Mesh Proximity Fallback:
      // If student taps on the organ surface near a landmark, snap to the nearest hotspot!
      if (!matchedHotspot && mainModel && hotspotMarkers.length > 0) {
        var organIntersects = raycaster.intersectObject(mainModel, true);
        if (organIntersects.length > 0) {
          var hitPt = organIntersects[0].point;
          var closestDist = Infinity;
          var closestHs = null;

          hotspotMarkers.forEach(function(m) {
            var markerPos = m.position;
            var dist = hitPt.distanceTo(markerPos);
            if (dist < closestDist) {
              closestDist = dist;
              closestHs = m.userData.hotspot;
            }
          });

          // If click is within 0.7 units of an anatomical landmark, select it!
          if (closestHs && closestDist <= 0.7) {
            matchedHotspot = closestHs;
          }
        }
      }

      if (matchedHotspot) {
        if (currentMode === 'learn' || currentMode === 'explore') {
          selectHotspot(matchedHotspot.id, true);
        } else if (currentMode === 'quiz') {
          handleQuizAnswer(matchedHotspot);
        }
      }
    }

    window.selectMode = function(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-tab').forEach(function(t) { t.classList.remove('active'); });
      var activeTab = document.getElementById('tab-' + mode);
      if (activeTab) activeTab.classList.add('active');

      var carousel = document.getElementById('hotspot-carousel-wrap');
      var quizBox = document.getElementById('quiz-box');

      if (mode === 'explore') {
        carousel.style.display = 'none';
        quizBox.style.display = 'none';
        hotspotMarkers.forEach(function(m) { m.visible = false; });
        closeSheet();
      } else if (mode === 'learn') {
        carousel.style.display = 'flex';
        quizBox.style.display = 'none';
        hotspotMarkers.forEach(function(m) { m.visible = true; });
        // Automatically open the first hotspot or general overview if available
        if (activeOrganData.hotspots && activeOrganData.hotspots.length > 0) {
          selectHotspot(activeOrganData.hotspots[0].id, false);
        } else {
          showGeneralOrganInfo();
        }
      } else if (mode === 'quiz') {
        carousel.style.display = 'none';
        quizBox.style.display = 'block';
        hotspotMarkers.forEach(function(m) { m.visible = true; });
        closeSheet();
        startQuizRound();
      }
    };

    function startQuizRound() {
      if (!activeOrganData.hotspots || activeOrganData.hotspots.length === 0) {
        document.getElementById('quiz-prompt').innerText = "Bu model için henüz test noktası tanımlanmadı.";
        return;
      }

      var randomIndex = Math.floor(Math.random() * activeOrganData.hotspots.length);
      quizTarget = activeOrganData.hotspots[randomIndex];
      document.getElementById('quiz-target-name').innerText = quizTarget.title + ' (' + (quizTarget.ta || '') + ')';
    }

    function handleQuizAnswer(selectedHotspot) {
      if (!quizTarget) return;

      if (selectedHotspot.id === quizTarget.id) {
        quizScore += 10;
        document.getElementById('score-val').innerText = quizScore;
        showToast("Tebrikler! Doğru Bildiniz 🎉 (+10 Puan)", "success");

        if (window.Android && window.Android.onCorrectAnswer) {
          try {
            window.Android.onCorrectAnswer(10);
          } catch(e) {
            console.log(e);
          }
        }

        setTimeout(function() {
          startQuizRound();
        }, 1600);
      } else {
        showToast("Yanlış! Burası " + selectedHotspot.title + ". Tekrar deneyin!", "error");
      }
    }

    function showToast(text, type) {
      var toast = document.getElementById('toast');
      toast.innerText = text;
      toast.className = type;
      toast.style.display = 'block';
      setTimeout(function() {
        toast.style.opacity = '1';
        toast.style.transform = 'translate(-50%, -50%) scale(1)';
      }, 10);

      setTimeout(function() {
        toast.style.opacity = '0';
        toast.style.transform = 'translate(-50%, -50%) scale(0.8)';
        setTimeout(function() { toast.style.display = 'none'; }, 300);
      }, 2000);
    }

    window.toggleAutoRotate = function() {
      autoRotate = !autoRotate;
      controls.autoRotate = autoRotate;
      controls.autoRotateSpeed = 2.0;
      document.getElementById('btn-rotate').classList.toggle('active', autoRotate);
    };

    window.resetCamera = function() {
      smoothMoveCamera(originalCameraPos.clone(), new THREE.Vector3(0, 0, 0));
    };

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      var time = performance.now() * 0.003;
      if (hotspotMarkers.length > 0) {
        hotspotMarkers.forEach(function(m) {
          if (m.userData.ringMesh) {
            m.userData.ringMesh.quaternion.copy(camera.quaternion);
          }
          var pulse = 1.0 + 0.14 * Math.sin(time * 2.5 + m.userData.index);
          m.scale.set(pulse, pulse, pulse);
        });
      }

      updateCameraTween();
      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = function() {
      initScene();
      loadCatalog();
    };
  </script>
</body>
</html>
